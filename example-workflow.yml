# Replace the action reference with the reviewed 40-character release commit.
# The service owner must authorize this workflow and its commit before enabling it.
name: Hattrick PR chat
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  ask:
    if: >-
      github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/hattrick ') ||
       startsWith(github.event.comment.body, '@hattrick '))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: HATTRICK_ACTION_OWNER/hattrick-pr-chat-action@REVIEWED_RELEASE_COMMIT
